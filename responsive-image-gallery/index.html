<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="filters">
    <button class= "Active" onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<div class="gallery">

    <div class="item nature">
        <img src="https://picsum.photos/id/1015/500/350" onclick="openLightbox(0)">
    </div>

    <div class="item city">
        <img src="https://picsum.photos/id/1011/500/350" onclick="openLightbox(1)">
    </div>

    <div class="item animals">
        <img src="https://picsum.photos/id/1074/500/350" onclick="openLightbox(2)">
    </div>

    <div class="item nature">
        <img src="https://picsum.photos/id/1040/500/350" onclick="openLightbox(3)">
    </div>

    <div class="item city">
        <img src="https://picsum.photos/id/1031/500/350" onclick="openLightbox(4)">
    </div>

    <div class="item animals">
        <img src="https://picsum.photos/id/593/500/350" onclick="openLightbox(5)">
    </div>

</div>

<!-- Lightbox -->

<div id="lightbox">

    <span class="close" onclick="closeLightbox()">×</span>

    <button class="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightbox-img">

    <button class="next" onclick="changeImage(1)">❯</button>

</div>

<script src="script.js"></script>

</body>
</html>
